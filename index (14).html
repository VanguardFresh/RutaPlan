<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#1F252B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ruta PROSEMBRA">
<title>Ruta PROSEMBRA</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --bg:#EEF1F4;--panel:#FFFFFF;--panel2:#F6F8FA;--ink:#1E252C;--soft:#5F6B76;--faint:#97A3AD;--line:#E3E8EC;
  --navy:#1F252B;--blue:#1A73E8;--blue2:#E8F0FE;--green:#1E9E5A;--green2:#E6F5EC;--red:#D93025;--red2:#FCE8E6;--amber:#B7791F;--amber2:#FEF3DC;
  --shadow:0 10px 30px -12px rgba(16,24,32,.35);--r:18px;
  --top:calc(env(safe-area-inset-top) + 58px);--sb:env(safe-area-inset-bottom);
  --vis:300px;
}
html.dark{
  --bg:#0E1216;--panel:#171C21;--panel2:#1E252B;--ink:#E7ECF0;--soft:#A7B2BC;--faint:#76828C;--line:#2A3238;
  --blue2:#19304F;--green2:#123524;--red2:#3A1C1A;--amber2:#382A12;--shadow:0 12px 34px -12px rgba(0,0,0,.8);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(14px, 2.4vw + 6px, 17px);-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.35;overscroll-behavior:none}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* ---------- mapa ---------- */
#map{position:fixed;inset:0;background:#DDE3E8;z-index:0}
html.dark #map{background:#151A1F}
.dk-tiles{filter:invert(1) hue-rotate(180deg) brightness(.92) contrast(.9) saturate(.45)}
.leaflet-control-attribution{display:none}
.rt-line{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.6s cubic-bezier(.6,.05,.3,1) .35s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.pin{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--rc,var(--blue));color:#fff;font:800 .82rem/1 Inter,Arial,sans-serif;border:3px solid #fff;box-shadow:0 4px 10px -2px rgba(0,0,0,.45);transition:transform .3s}
.pin.a{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(var(--i)*70ms + .3s)}
.pin.ag{background:#5B4BB7}.st.agst:not(.ok):not(.no) .sh .n{background:#5B4BB7}.oc.agc{background:#EEEAFB;color:#5B4BB7;border-color:transparent}
.pin.ok{background:var(--green)}.pin.no{background:var(--red)}.pin.sk{background:#8A96A0}
.pin.pnx{width:42px;height:42px;font-size:.95rem;box-shadow:0 0 0 0 rgba(26,115,232,.55),0 4px 12px -2px rgba(0,0,0,.5);animation:ring 1.8s ease-out 1s infinite}
.pin.pnx.a{animation:drop .5s cubic-bezier(.3,1.5,.5,1) both,ring 1.8s ease-out 1s infinite;animation-delay:calc(var(--i)*70ms + .3s),1.2s}
@keyframes drop{from{transform:translateY(-26px) scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(26,115,232,.55),0 4px 12px -2px rgba(0,0,0,.5)}100%{box-shadow:0 0 0 18px rgba(26,115,232,0),0 4px 12px -2px rgba(0,0,0,.5)}}
.me{position:relative;width:22px;height:22px}
.me i{position:absolute;inset:0;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);z-index:2}
.me b{position:absolute;inset:-14px;border-radius:50%;background:rgba(26,115,232,.18);animation:breathe 2.2s ease-in-out infinite}
.me u{position:absolute;left:50%;top:50%;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-bottom:34px solid rgba(26,115,232,.32);transform-origin:50% 100%;margin:-34px 0 0 -15px;z-index:1}
@keyframes breathe{50%{transform:scale(1.35);opacity:.55}}
.bbpin{width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 5px 14px -4px rgba(0,0,0,.5);border:2px solid #fff;animation:drop .5s cubic-bezier(.3,1.5,.5,1) both}
.flag{position:absolute;left:0;bottom:30px;transform:translateX(-50%);white-space:nowrap;font:800 .72rem/1 Inter,Arial,sans-serif;padding:6px 10px;border-radius:99px;color:#fff;border:1.5px solid #fff;box-shadow:0 4px 10px -3px rgba(0,0,0,.45);pointer-events:none}
.flag::after{content:'';position:absolute;left:50%;bottom:-6px;width:8px;height:8px;background:inherit;border-right:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:translateX(-50%) rotate(45deg)}
.flag.s{background:#1E8E4E}.flag.e{background:#2C333B}
/* ---------- encabezado ---------- */
.top{position:fixed;left:0;right:0;top:0;z-index:20;padding:calc(env(safe-area-inset-top) + 8px) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px;color:#fff;
  background:linear-gradient(180deg,rgba(20,25,30,.94),rgba(20,25,30,.82));backdrop-filter:blur(12px) saturate(1.2);-webkit-backdrop-filter:blur(12px) saturate(1.2)}
.top .bb{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:grid;place-items:center;flex:0 0 40px}
.top .tt{min-width:0;flex:1}
.top .tt b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .bb{box-shadow:inset 0 -3px 0 var(--rc,transparent)}
.top .tt small{display:block;color:#B4C0CA;font-size:.78rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gone{display:flex;flex-direction:column;gap:4px;margin-top:10px;font-size:.8rem;color:var(--faint);font-style:italic}
.newtag{font-style:normal;font-size:.68rem;font-weight:800;color:#fff;background:#7A5BA8;border-radius:99px;padding:2px 7px;margin-left:4px;vertical-align:1px}
.chg{padding:10px 12px;border-radius:12px;margin-top:8px;font-size:.92rem}.chg.add{background:var(--green2)}.chg.rem{background:var(--red2)}
.pill{display:flex;align-items:center;gap:6px;font-size:.75rem;font-weight:800;padding:6px 10px;border-radius:99px;background:rgba(255,255,255,.12);white-space:nowrap;flex:0 0 auto}
.pill i{width:8px;height:8px;border-radius:50%;background:#8A96A0}
.pill.on i{background:#38D39F;animation:pl 1.6s infinite}.pill.off i{background:#F2A33A}
@keyframes pl{0%{box-shadow:0 0 0 0 rgba(56,211,159,.7)}100%{box-shadow:0 0 0 9px rgba(56,211,159,0)}}
.ib{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:0 0 38px;color:#fff}
.prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.12)}
.prog i{display:block;height:100%;width:0;background:var(--rc,linear-gradient(90deg,#38D39F,#6ECBC9));transition:width .8s cubic-bezier(.3,1,.4,1)}
.net{position:fixed;left:50%;top:calc(var(--top) + 8px);transform:translate(-50%,-140%);z-index:19;background:#3A2A0E;color:#FFD89A;font-size:.78rem;font-weight:700;padding:7px 12px;border-radius:99px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.3,1.3,.5,1);white-space:nowrap}
.net.show{transform:translate(-50%,0)}
/* ---------- panel deslizable ---------- */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:10;height:calc(100dvh - var(--top) - 6px);background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -10px 34px -12px rgba(0,0,0,.35);
  transform:translateY(calc(100% - var(--vis)));transition:transform .42s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;will-change:transform}
.sheet.drag{transition:none}
.grab{flex:0 0 auto;height:26px;display:grid;place-items:center;touch-action:none;cursor:grab}
.grab i{width:42px;height:5px;border-radius:99px;background:var(--line)}
.sc{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:0 max(14px,env(safe-area-inset-right)) calc(18px + var(--sb)) max(14px,env(safe-area-inset-left));-webkit-overflow-scrolling:touch;scrollbar-width:none}
.sc::-webkit-scrollbar{display:none}
.fab{position:fixed;right:max(14px,env(safe-area-inset-right));bottom:calc(var(--vis) + 14px);z-index:9;width:48px;height:48px;border-radius:50%;background:var(--panel);color:var(--blue);display:grid;place-items:center;box-shadow:var(--shadow);transition:bottom .42s cubic-bezier(.22,1,.36,1),transform .25s,opacity .25s}
.fab.hide{transform:scale(.6);opacity:0;pointer-events:none}
@media (min-width:760px),(orientation:landscape) and (max-height:560px){
  :root{--side:min(420px,46vw)}
  .sheet{left:0;right:auto;top:var(--top);bottom:0;height:auto;width:var(--side);border-radius:0 22px 0 0;transform:none!important}
  .grab{display:none}
  .sc{padding-top:12px}
  .fab{bottom:calc(18px + var(--sb))}
  #map{left:var(--side)}
}
/* ---------- contenido ---------- */
.k{font-size:.7rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.hello{padding:2px 2px 12px}
.hello h1{margin:0;font-size:1.45rem;letter-spacing:-.01em}
.hello p{margin:4px 0 0;color:var(--soft);font-size:.9rem}
.ends{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 0 12px}
.ends div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 11px;min-width:0}
.ends b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.b{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 16px;border-radius:15px;font-weight:800;font-size:.95rem;background:var(--panel2);border:1px solid var(--line);color:var(--ink);transition:transform .12s,filter .15s;user-select:none;-webkit-user-select:none;white-space:nowrap}
.b:active{transform:scale(.96)}
.b svg{flex:0 0 auto}
.b.go{width:100%;min-height:60px;font-size:1.1rem;background:linear-gradient(135deg,#22B067,#178A4E);border:0;color:#fff;box-shadow:0 10px 24px -10px rgba(30,158,90,.8);animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 10px 30px -6px rgba(30,158,90,.95)}}
.b.nav{background:var(--blue);border-color:var(--blue);color:#fff}
.b.ok{background:linear-gradient(135deg,#22B067,#178A4E);border:0;color:#fff}
.b.no{background:var(--panel);border-color:#F1B9B3;color:var(--red)}
html.dark .b.no{border-color:#6B2C27}
.b.ghost{background:transparent;border-color:var(--line);color:var(--soft)}
.b.wa{color:#1DA851}
.note{background:var(--amber2);border-radius:14px;padding:10px 12px;font-size:.84rem;color:var(--ink);margin:10px 0}
.note.warn{background:var(--red2)}
.note ol{margin:6px 0 10px;padding-left:20px}.note li{margin:4px 0}
.nx{background:var(--panel);border:2px solid var(--blue);border-radius:var(--r);padding:14px;box-shadow:0 8px 26px -14px rgba(26,115,232,.6);position:relative;overflow:hidden}
.nx.enter{animation:slidein .5s cubic-bezier(.22,1,.36,1)}
@keyframes slidein{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.nx-k{display:flex;justify-content:space-between;align-items:center;color:var(--blue)}
.nx h2{margin:4px 0 4px;font-size:1.32rem;line-height:1.2;letter-spacing:-.01em;word-break:break-word}
.nx-m{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;color:var(--soft);font-size:.88rem}
.eta{display:inline-flex;align-items:center;gap:5px;font-weight:800;color:var(--ink);background:var(--blue2);padding:4px 10px;border-radius:99px}
.ocos{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 2px}
.oc{font-size:.78rem;font-weight:800;padding:5px 9px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.oc.v{background:var(--red2);border-color:transparent;color:var(--red)}
button.oc.more{color:var(--blue);background:var(--blue2);border-color:transparent;cursor:pointer}
.ock{margin-top:12px}
.row{display:grid;gap:8px;margin-top:12px}
.row.nav4{grid-template-columns:repeat(auto-fit,minmax(min(100%,120px),1fr))}
.row.mk{grid-template-columns:1.4fr 1fr}
.row.mk .b{min-height:58px;font-size:1rem}
.mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.phs{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.pht{position:relative;width:58px;height:58px;border-radius:12px;overflow:visible;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;color:var(--soft)}
.pht img{width:100%;height:100%;object-fit:cover;border-radius:11px}
.pht button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;font-size:15px;line-height:1;display:grid;place-items:center;border:2px solid var(--panel);padding:0}
.pht.add{font-size:24px;font-weight:600;color:var(--blue);border-style:dashed;cursor:pointer}
.mini button:disabled{opacity:.5}
.mini button{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;font-weight:700;color:var(--soft);padding:9px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
.arr{margin-top:10px;background:var(--green2);color:var(--green);border-radius:12px;padding:9px 11px;font-weight:800;font-size:.86rem;display:flex;align-items:center;gap:8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.list{display:flex;flex-direction:column;gap:8px}
.st{background:var(--panel2);border:1px solid var(--line);border-radius:16px;overflow:hidden;animation:rise .45s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i)*45ms)}
@keyframes rise{from{transform:translateY(12px);opacity:0}to{transform:none;opacity:1}}
.sh{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 12px;width:100%;text-align:left}
.sh .n{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;font-size:.85rem}
.st.ok .sh .n{background:var(--green)}.st.no .sh .n{background:var(--red)}.st.sk .sh .n{background:#8A96A0}
.sh>span:nth-child(2){min-width:0}
.st.is-nx{border-color:var(--blue);box-shadow:inset 3px 0 0 var(--blue)}
.sh b{display:block;font-size:.92rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh span{display:block;font-size:.78rem;color:var(--soft)}
.chip{font-size:.72rem;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--panel);color:var(--soft);white-space:nowrap;border:1px solid var(--line)}
.chip.ok{background:var(--green2);color:var(--green);border-color:transparent}.chip.no{background:var(--red2);color:var(--red);border-color:transparent}
.sb{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.st.open .sb{grid-template-rows:1fr}
.sb>div{overflow:hidden;padding:0 12px}
.st.open .sb>div{padding-bottom:12px}
.sb .row{margin-top:8px}
.foot{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}.foot.one{grid-template-columns:1fr}
.foot .b{white-space:normal;text-align:center;line-height:1.15;padding:6px 10px;font-size:.88rem}
.done{text-align:center;padding:16px 8px 6px}
.done h2{margin:8px 0 4px;font-size:1.3rem}
.done p{margin:0;color:var(--soft)}
.sum{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:14px}
.sum div{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 12px;text-align:left}
.sum b{display:block;font-size:1.35rem;margin-top:2px;font-variant-numeric:tabular-nums}
.skel{height:16px;border-radius:8px;background:linear-gradient(90deg,var(--panel2),var(--line),var(--panel2));background-size:200% 100%;animation:sk 1.2s linear infinite;margin:10px 0}
@keyframes sk{to{background-position:-200% 0}}
/* ---------- ventanas ---------- */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,14,18,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.ov .box{width:min(560px,100%);max-height:88dvh;overflow-y:auto;background:var(--panel);border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right)) calc(18px + var(--sb)) max(16px,env(safe-area-inset-left));animation:up .38s cubic-bezier(.22,1,.36,1);scrollbar-width:none}
@media (min-width:760px),(orientation:landscape) and (max-height:560px){.ov{align-items:center}.ov .box{border-radius:24px;max-height:92dvh}}
@keyframes up{from{transform:translateY(60px);opacity:.3}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.box h3{margin:2px 0 4px;font-size:1.25rem}
.box p{margin:0 0 10px;color:var(--soft);font-size:.9rem}
.reasons{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.reasons button{min-height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);font-weight:700;font-size:.9rem;padding:6px 10px;transition:all .15s}
.reasons button.on{border-color:var(--red);background:var(--red2);color:var(--red)}
textarea{width:100%;min-height:70px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);padding:10px 12px;resize:vertical;font-size:.95rem}
textarea:focus{outline:none;border-color:var(--blue)}
.splash{position:fixed;inset:0;z-index:60;background:radial-gradient(120% 80% at 50% 30%,#26303A,#12171C);display:grid;place-items:center;color:#fff;text-align:center;transition:opacity .5s,visibility .5s}
.splash.hide{opacity:0;visibility:hidden}
.splash .bbig{animation:bounce 1.4s cubic-bezier(.3,1.4,.5,1) infinite}
@keyframes bounce{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04)}60%{transform:translateY(0) scale(.97,1.03)}}
.splash b{display:block;font-size:1.15rem;margin-top:14px}
.splash small{display:block;color:#9FB0BC;margin-top:4px}
.splash .bar{width:140px;height:4px;border-radius:99px;background:rgba(255,255,255,.12);margin:16px auto 0;overflow:hidden}
.splash .bar i{display:block;width:40%;height:100%;background:#6ECBC9;border-radius:inherit;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(260%)}}
.err{padding:30px 20px;text-align:center}
.err input{width:100%;min-height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel2);padding:0 12px;margin:12px 0}
.toast{pointer-events:none;position:fixed;left:50%;top:calc(var(--top) + 12px);transform:translate(-50%,-20px);background:var(--navy);color:#fff;padding:11px 16px;border-radius:14px;font-size:.88rem;font-weight:700;z-index:70;opacity:0;transition:opacity .25s,transform .35s cubic-bezier(.3,1.3,.5,1);max-width:92vw;text-align:center;box-shadow:var(--shadow)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.check{position:fixed;inset:0;z-index:65;display:grid;place-items:center;pointer-events:none}
.check div{width:132px;height:132px;border-radius:50%;background:rgba(30,158,90,.95);display:grid;place-items:center;box-shadow:0 20px 50px -10px rgba(30,158,90,.8);animation:pop .9s cubic-bezier(.3,1.5,.5,1) forwards}
.check.no div{background:rgba(217,48,37,.95);box-shadow:0 20px 50px -10px rgba(217,48,37,.7)}
.check path{stroke-dasharray:60;stroke-dashoffset:60;animation:tick .45s .2s ease-out forwards}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.08);opacity:1}75%{transform:scale(1);opacity:1}100%{transform:scale(.9);opacity:0}}
@keyframes tick{to{stroke-dashoffset:0}}
#fx{position:fixed;inset:0;z-index:66;pointer-events:none}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

    if(openI===i && map){ const s = plan.stops[i]; follow = false; paintFab(); map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 14), {duration:.7}); } return; }
});
addEventListener('online', ()=>{ failT = 0; flush(); paintNet(); }); addEventListener('offline', paintNet);
setInterval(()=>{ flush(); paintNet(); }, 15000);
setInterval(()=>{ if(!localStorage.getItem(TK)) applyTheme(); }, 300000);
if('serviceWorker' in navigator && location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
})();
